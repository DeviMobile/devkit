name: New SDK lints

# Weekly: when the latest stable Dart SDK has different lint rules than
# tool/sdk_rules.json, open a PR with the new snapshot. Its CI fails on the
# completeness test until every new rule has a decision in
# tool/decisions.yaml; maintainers add them on the PR branch.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: new-lints

jobs:
  update:
    if: vars.BOT_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/devimobile_devkit_lints
    steps:
      # A PR opened with GITHUB_TOKEN would not run CI, so act as the App.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - id: update
        run: |
          dart run tool/update_sdk_rules.dart --only-if-rules-changed
          if git diff --quiet -- tool/sdk_rules.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sdk=$(dart --version 2>&1 | sed -n 's/.*version: \([0-9.]*\).*/\1/p')" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SDK: ${{ steps.update.outputs.sdk }}
          REPO: ${{ github.repository }}
        run: |
          branch="bot/sdk-lints-$SDK"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null; then
            echo "Branch $branch already exists; nothing to do."
            exit 0
          fi

          {
            echo "The lint catalog of Dart SDK $SDK differs from \`tool/sdk_rules.json\`."
            echo
            echo "CI fails until every problem below is resolved in \`tool/decisions.yaml\`"
            echo "(then run \`dart run tool/generate.dart\`). Retitle the PR by the"
            echo "versioning policy: \`feat(lints)!:\` if a rule gets enabled,"
            echo "\`feat(lints):\` if all new rules stay off."
            echo
            echo '```'
            dart run tool/generate.dart --check 2>&1 || true
            echo '```'
          } > "$RUNNER_TEMP/body.md"

          user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(lints): lint catalog of Dart SDK $SDK"
          git push "$remote" "$branch"
          gh pr create \
            --repo "$REPO" \
            --head "$branch" \
            --title "chore(lints): decide on lint rules of Dart SDK $SDK" \
            --body-file "$RUNNER_TEMP/body.md"
