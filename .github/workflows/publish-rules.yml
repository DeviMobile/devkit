name: Publish devimobile_devkit_rules

on:
  push:
    tags: ['devimobile_devkit_rules-v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

jobs:
  verify-tag:
    name: Tag matches pubspec version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: *//p' packages/devimobile_devkit_rules/pubspec.yaml)
          if [ "$TAG" != "devimobile_devkit_rules-v$version" ]; then
            echo "::error::Tag $TAG does not match pubspec version $version"
            exit 1
          fi

  publish:
    needs: verify-tag
    permissions:
      id-token: write # OIDC token for pub.dev automated publishing
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      environment: pub.dev
      working-directory: packages/devimobile_devkit_rules
